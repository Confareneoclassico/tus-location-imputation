# End-to-end test on synthetic data (tests/run_tests.py) on every push and pull request.
# Needs no restricted data.
name: tests
on:
  push:
  pull_request:
jobs:
  synthetic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python tests/run_tests.py
